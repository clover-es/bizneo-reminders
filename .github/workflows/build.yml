name: Test and package extension

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npm run build

      - name: Restore CRX signing key
        if: github.event_name == 'push'
        env:
          CRX_PRIVATE_KEY_B64: ${{ secrets.CRX_PRIVATE_KEY_B64 }}
        run: |
          if [[ -n "$CRX_PRIVATE_KEY_B64" ]]; then
            mkdir -p release
            printf '%s' "$CRX_PRIVATE_KEY_B64" | base64 --decode > release/bizneo-reminders.pem
            chmod 600 release/bizneo-reminders.pem
          fi

      - name: Build and package extension
        run: npm run package:crx

      - name: Upload extension packages
        uses: actions/upload-artifact@v4
        with:
          name: bizneo-reminders-${{ github.sha }}
          path: |
            release/bizneo-reminders.crx
            release/bizneo-reminders.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "Build $GITHUB_SHA" \
            --notes "Load the extension from the extracted ZIP with Edge developer mode." \
            release/bizneo-reminders.zip